specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PredepositVault
    network: sepolia
    source:
      abi: PredepositVault
      address: "0x89b2269dd3b6c7fa09f63c327759333bfb99dfdc"
      startBlock: 9258680
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultDeposit
      abis:
        - name: PredepositVault
          file: ../out/PredepositVault.sol/PredepositVault.json
      eventHandlers:
        - event: Deposited(indexed uint8,indexed address,address,indexed
            address,uint256,uint32)
          handler: handlePredepositVaultDeposit
      file: ./src/predeposit-vault.ts
  - kind: ethereum
    name: USDai
    network: sepolia
    source:
      abi: USDai
      address: "0xeb29fbaa2d509e43313c196a82f4ad75fa251285"
      startBlock: 8311763
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - USDaiStats
      abis:
        - name: USDai
          file: ../out/USDai.sol/USDai.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/usdai.ts
  - kind: ethereum
    name: sUSDai
    network: sepolia
    source:
      abi: StakedUSDai
      address: "0x1897bc1717d4ad5abcfa2ee47edb3265e9f4fd7c"
      startBlock: 8277640
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RedemptionRequest
        - RedemptionProcessed
        - RedemptionSharePriceSnapshot
        - SUSDaiStats
      abis:
        - name: StakedUSDai
          file: ../out/StakedUSDai.sol/StakedUSDai.json
      eventHandlers:
        - event: RedeemRequest(indexed address,indexed address,indexed uint256,address,uint256)
          handler: handleRedeemRequest
        - event: RedemptionProcessed(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleRedemptionProcessed
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleSUSDaiTransfer
      file: ./src/staked-usdai.ts
